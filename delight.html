<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elements of Delight — Tiffany Choi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/cvf5iup.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="custom-cursor" aria-hidden="true">
  <span class="custom-cursor__label"></span>
</div>

<header class="dg-nav">
  <nav class="dg-nav__links">
    <a href="#dg-section-logos" class="dg-nav__link" data-dg-nav="0">Logos</a>
    <a href="#dg-section-menu-designs" class="dg-nav__link" data-dg-nav="1">Menu Designs</a>
    <a href="#dg-section-apparel-design" class="dg-nav__link" data-dg-nav="2">Apparel Design</a>
  </nav>
    <a href="index.html" class="dg-nav__logo-link" aria-label="Home">
    <img src="assets/images/logo-magenta.png" alt="tiff choi design" class="dg-nav__logo">
    </a>
</header>

<main class="dg-main">
  <section class="dg-gallery" data-dg-gallery>
    <div class="dg-gallery__spacer" data-dg-spacer>
      <div class="dg-gallery__pin" data-dg-pin>
        <div class="dg-gallery__bg" data-dg-bg aria-hidden="true"></div>
        <div class="dg-gallery__strip" data-dg-strip>

          <div class="dg-section" id="dg-section-logos" data-dg-section>
            <div class="dg-track dg-track--a" data-dg-track data-dg-speed="-90">
              <button type="button" class="dg-thumb" data-dg-project="bear-repub" style="--dg-x:35.42%; --dg-y:3.48%; --dg-w:132px; --dg-h:176px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-bear-repub-thumb.jpg" alt="Bear Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="corner-drafthouse" style="--dg-x:81.53%; --dg-y:9.75%; --dg-w:227px; --dg-h:303px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-corner-drafthouse-thumb.jpg" alt="Corner Drafthouse">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="npbc" style="--dg-x:6.04%; --dg-y:22.28%; --dg-w:187px; --dg-h:249px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-npbc-thumb.jpg" alt="NPBC">
              </button>
            </div>
            <div class="dg-track dg-track--b" data-dg-track data-dg-speed="140">
              <button type="button" class="dg-thumb" data-dg-project="pizza-repub" style="--dg-x:28.13%; --dg-y:55.57%; --dg-w:202px; --dg-h:269px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-pizza-repub-thumb.jpg" alt="Pizza Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="waterbar" style="--dg-x:70.00%; --dg-y:47.49%; --dg-w:201px; --dg-h:268px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-waterbar-thumb.jpg" alt="Waterbar">
              </button>
            </div>
            <h2 class="dg-section__label">Logos</h2>
            <img class="dg-star" style="--dg-x:20.35%; --dg-y:65.88%;" src="assets/images/delight-gallery-star-md.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:67.64%; --dg-y:11.70%;" src="assets/images/delight-gallery-star-sm.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:67.64%; --dg-y:78.00%;" src="assets/images/delight-gallery-star-lg.png" alt="" aria-hidden="true">
          </div>

          <div class="dg-section" id="dg-section-menu-designs" data-dg-section>
            <div class="dg-track dg-track--a" data-dg-track data-dg-speed="-90">
              <button type="button" class="dg-thumb" data-dg-project="bear-repub" style="--dg-x:35.42%; --dg-y:3.48%; --dg-w:132px; --dg-h:176px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-bear-repub-thumb.jpg" alt="Bear Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="corner-drafthouse" style="--dg-x:81.53%; --dg-y:9.75%; --dg-w:227px; --dg-h:303px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-corner-drafthouse-thumb.jpg" alt="Corner Drafthouse">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="npbc" style="--dg-x:6.04%; --dg-y:22.28%; --dg-w:187px; --dg-h:249px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-npbc-thumb.jpg" alt="NPBC">
              </button>
            </div>
            <div class="dg-track dg-track--b" data-dg-track data-dg-speed="140">
              <button type="button" class="dg-thumb" data-dg-project="pizza-repub" style="--dg-x:28.13%; --dg-y:55.57%; --dg-w:202px; --dg-h:269px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-pizza-repub-thumb.jpg" alt="Pizza Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="waterbar" style="--dg-x:70.00%; --dg-y:47.49%; --dg-w:201px; --dg-h:268px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-waterbar-thumb.jpg" alt="Waterbar">
              </button>
            </div>
            <h2 class="dg-section__label">Menu<br>Designs</h2>
            <img class="dg-star" style="--dg-x:6.81%; --dg-y:84.82%;" src="assets/images/delight-gallery-star-md.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:52.85%; --dg-y:11.56%;" src="assets/images/delight-gallery-star-sm.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:87.50%; --dg-y:56.96%;" src="assets/images/delight-gallery-star-lg.png" alt="" aria-hidden="true">
          </div>

          <div class="dg-section" id="dg-section-apparel-design" data-dg-section>
            <div class="dg-track dg-track--a" data-dg-track data-dg-speed="-90">
              <button type="button" class="dg-thumb" data-dg-project="bear-repub" style="--dg-x:35.42%; --dg-y:3.48%; --dg-w:132px; --dg-h:176px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-bear-repub-thumb.jpg" alt="Bear Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="corner-drafthouse" style="--dg-x:81.53%; --dg-y:9.75%; --dg-w:227px; --dg-h:303px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-corner-drafthouse-thumb.jpg" alt="Corner Drafthouse">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="npbc" style="--dg-x:6.04%; --dg-y:22.28%; --dg-w:187px; --dg-h:249px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-npbc-thumb.jpg" alt="NPBC">
              </button>
            </div>
            <div class="dg-track dg-track--b" data-dg-track data-dg-speed="140">
              <button type="button" class="dg-thumb" data-dg-project="pizza-repub" style="--dg-x:28.13%; --dg-y:55.57%; --dg-w:202px; --dg-h:269px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-pizza-repub-thumb.jpg" alt="Pizza Republic">
              </button>
              <button type="button" class="dg-thumb" data-dg-project="waterbar" style="--dg-x:70.00%; --dg-y:47.49%; --dg-w:201px; --dg-h:268px;">
                <img class="dg-thumb__image" src="assets/images/delight-gallery-waterbar-thumb.jpg" alt="Waterbar">
              </button>
            </div>
            <h2 class="dg-section__label">Apparel<br>Design</h2>
            <img class="dg-star" style="--dg-x:77.01%; --dg-y:5.57%;" src="assets/images/delight-gallery-star-md.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:29.24%; --dg-y:39.69%;" src="assets/images/delight-gallery-star-sm.png" alt="" aria-hidden="true">
            <img class="dg-star" style="--dg-x:48.13%; --dg-y:74.37%;" src="assets/images/delight-gallery-star-lg.png" alt="" aria-hidden="true">
          </div>

        </div>
      </div>
    </div>
  </section>
</main>

<div class="tooltip" role="tooltip">
  <p class="tooltip__text"></p>
  <div class="tooltip__arrow" aria-hidden="true"></div>
</div>

<div class="dg-zoom" data-dg-zoom aria-hidden="true">
  <button type="button" class="dg-zoom__close" data-dg-zoom-close aria-label="Close">&times;</button>
  <div class="dg-zoom__controls">
    <button type="button" class="dg-zoom__zoom-btn" data-dg-zoom-out aria-label="Zoom out">&minus;</button>
    <button type="button" class="dg-zoom__zoom-btn" data-dg-zoom-in aria-label="Zoom in">&plus;</button>
  </div>
  <div class="dg-zoom__stage" data-dg-zoom-stage>
    <img class="dg-zoom__image" data-dg-zoom-image alt="">
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
